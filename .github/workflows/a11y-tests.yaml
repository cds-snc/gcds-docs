name: A11y test documentation site

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'reports/**'
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - docs/**
      - .github/workflows/a11y-tests.yaml

jobs:
  a11y-test:
    name: ${{ matrix.test.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: English site
            spec: cypress/e2e/a11y-en.cy.js
          - name: French site
            spec: cypress/e2e/a11y-fr.cy.js

    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '22'

      - name: Cypress run
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: ./docs
          build: npm run build
          start: npm run preview -- --host 0.0.0.0
          wait-on: http://127.0.0
          wait-on-timeout: 240
          spec: ${{ matrix.test.spec }}
