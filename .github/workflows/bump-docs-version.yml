name: Bump documentation version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New documentation version (e.g. 1.7.0)"
        required: true
        type: string
      base:
        description: "Branch to create the new branch from"
        required: false
        default: main
        type: string
      branch:
        description: "Optional branch name (defaults to docs/bump-version-<version>)"
        required: false
        type: string
      open-pr:
        description: "Open a pull request when done"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump documentation version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BASE: ${{ inputs.base }}
      BRANCH: ${{ inputs.branch || format('docs/bump-version-{0}', inputs.version) }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.7.0 (got '$VERSION')"
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0

      - name: Create or reuse branch
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch '$BRANCH' already exists, checking it out."
            git fetch origin "$BRANCH"
            git switch "$BRANCH"
          else
            echo "Creating branch '$BRANCH' from '$BASE'."
            git switch -c "$BRANCH"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Bump documentation version
        run: node docs/scripts/bump-docs-version.js "$VERSION"

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/src/routing/versioned/version-config.json
          git add "docs/src/content/versioned/components/$VERSION"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "docs: add version $VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "HEAD:$BRANCH"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true' && inputs.open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "$BRANCH" --json state -q '.state' 2>/dev/null | grep -q OPEN; then
            echo "A pull request for '$BRANCH' is already open."
            exit 0
          fi

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "docs: add version $VERSION" \
            --body "Adds documentation version \`$VERSION\`. Generated by the **Bump documentation version** workflow."
